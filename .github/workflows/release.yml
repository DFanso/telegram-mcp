name: Release

# Pushing a tag like v1.2.3 publishes the Windows tray app, builds tgmcp for every platform with
# scripts/release.ts (the tray goes in the Windows zip), installs
# each build with its own installer on that platform and starts the daemon, then publishes the
# GitHub release with notes from CHANGELOG.md. The tag must match package.json's version.
#
# Pull requests that touch the release files run the same build and install checks, without
# publishing anything.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.ts
      - scripts/install.sh
      - scripts/install.ps1
      - src/cli.ts
      - src/launchd.ts
      - src/shared/runtime.ts
      - src/tray.ts
      - menubar/**
      - tray/**
      - package.json
      - bun.lock
      - CHANGELOG.md
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

jobs:
  tray:
    # The Windows tray app, self-contained in one exe, so it runs without .NET installed.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Publish TelegramMCPTray.exe
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          dotnet publish tray/App/TelegramMCPTray.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$version -o tray-dist -nologo
          if (-not (Test-Path tray-dist/TelegramMCPTray.exe)) { throw 'dotnet publish made no TelegramMCPTray.exe' }
          Get-ChildItem tray-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tray
          path: tray-dist/TelegramMCPTray.exe
          if-no-files-found: error

  build:
    # macOS, because the macOS archives include the menu bar app. Bun cross-compiles the rest.
    needs: tray
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tray
          path: tray-dist
      # On a tag, this also checks the tag against package.json and CHANGELOG.md.
      - run: bun scripts/release.ts --out dist --windows-tray tray-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  install:
    # Each build, installed by its installer on its own platform, then the daemon started.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TELEGRAM_MCP_SECRET_STORE: file
      TELEGRAM_MCP_PORT: "47990"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Install with tgmcp-installer.sh, run the daemon
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          python3 -m http.server 8765 -b 127.0.0.1 -d dist/assets >/dev/null 2>&1 &
          sleep 1
          TGMCP_DOWNLOAD_URL=http://127.0.0.1:8765 TGMCP_INSTALL_DIR="$RUNNER_TEMP/bin" TGMCP_APP_DIR="$RUNNER_TEMP/Applications" \
            sh dist/assets/tgmcp-installer.sh
          "$RUNNER_TEMP/bin/tgmcp" version | tee version.txt
          grep -q "^tgmcp $version (release build" version.txt
          if [ "$RUNNER_OS" = macOS ]; then
            test -x "$RUNNER_TEMP/Applications/Telegram MCP.app/Contents/MacOS/TelegramMCPBar"
          fi
          export TELEGRAM_MCP_HOME="$RUNNER_TEMP/home"
          "$RUNNER_TEMP/bin/tgmcp" daemon &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$TELEGRAM_MCP_PORT/health" && break; sleep 0.5; done
          curl -sf "http://127.0.0.1:$TELEGRAM_MCP_PORT/health"
          "$RUNNER_TEMP/bin/tgmcp" status

      # The documented command runs Windows PowerShell 5.1, so test with that.
      - name: Install with tgmcp-installer.ps1, run the daemon
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '-b', '127.0.0.1', '-d', 'dist/assets' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $env:TGMCP_DOWNLOAD_URL = 'http://127.0.0.1:8765'
          $env:TGMCP_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          Get-Content -Raw dist/assets/tgmcp-installer.ps1 | Invoke-Expression
          $exe = Join-Path $env:TGMCP_INSTALL_DIR 'tgmcp.exe'
          $out = & $exe version
          $out
          if ($out -notmatch "^tgmcp $([regex]::Escape($version)) \(release build") { throw "unexpected version output: $out" }
          # The tray app sits next to tgmcp.exe. --quit with none running starts it (the
          # self-contained runtime and WPF) and exits 0, without a window or the Run key.
          $tray = Join-Path $env:TGMCP_INSTALL_DIR 'TelegramMCPTray.exe'
          if (-not (Test-Path $tray)) { throw 'the installer did not put TelegramMCPTray.exe next to tgmcp.exe' }
          $quit = Start-Process $tray -ArgumentList '--quit' -PassThru -Wait
          if ($quit.ExitCode -ne 0) { throw "TelegramMCPTray.exe --quit exited with $($quit.ExitCode)" }
          $env:TELEGRAM_MCP_HOME = Join-Path $env:RUNNER_TEMP 'home'
          $daemon = Start-Process $exe -ArgumentList 'daemon' -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:TELEGRAM_MCP_PORT/health" | Out-Null; $ok = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { throw 'the daemon did not answer /health' }
          & $exe status
          # `tgmcp menubar` from a release starts the prebuilt tray next to tgmcp.exe (never dotnet),
          # sets it to start at login and starts it. The runner is thrown away afterwards.
          $menubar = & $exe menubar | Out-String
          $menubar
          if ($LASTEXITCODE -ne 0 -or $menubar -notmatch 'TelegramMCPTray\.exe' -or $menubar -match 'tray\\build') { throw "tgmcp menubar did not start the installed tray app" }
          Start-Sleep 3
          if (-not (Get-Process -Name 'TelegramMCPTray' -ErrorAction SilentlyContinue)) { throw 'the tray app is not running after tgmcp menubar' }
          & $exe menubar uninstall
          if ($LASTEXITCODE -ne 0) { throw 'tgmcp menubar uninstall failed' }
          Stop-Process $daemon -ErrorAction SilentlyContinue
          Stop-Process $server -ErrorAction SilentlyContinue

  publish:
    needs: [build, install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file dist/notes.md $prerelease
